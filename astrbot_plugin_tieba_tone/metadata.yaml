name: astrbot_plugin_tieba_tone
display_name: 吧味学习机
short_desc: 刷贴吧帖子学语言风格，让 AI 对话带上吧友味
desc: |
  按管理员配置的贴吧列表，定时抓取帖子与楼层评论（全程只读，不发帖、不回复），
  交给 LLM 提炼出「语言风格指南 + 代表性语录」，并在后续 AI 对话时自动注入系统提示词，
  让机器人的回复带上该吧吧友的说话风格。

  主要特性：
  - 定时刷帖学习（每天/每小时可配），支持配置每帖抓取数量与请求间隔
  - 全程只读：只抓取公开帖子与评论，不会发表任何内容
  - WebUI 可视化视图：扫码登录百度账号、全配置项可视化修改、模型下拉选择、语料库与运行日志查看
  - 兼容 AstrBot 4.29.3+ 的插件视图与 Web API
version: 1.0.0
author: Chescy20
repo: https://github.com/Chescy20/astrbot_plugin_tieba_tone
astrbot_version: ">=4.29.3"
social_link: https://github.com/Chescy20
